<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Preprocessing | HCP Demo</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/papaya-viewer@1.0.1455/release/current/standard/papaya.min.css">
    <script src="https://cdn.jsdelivr.net/npm/papaya-viewer@1.0.1455/release/current/standard/papaya.min.js"></script>
    <style>
        html {
            overflow: auto !important;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px 40px 200px 40px;
            overflow: auto !important;
        }

        .header {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            text-align: left;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            margin: 5px 0 0 0;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 10px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .viewer-label {
            max-width: 1000px;
            margin: 20px auto 8px auto;
            text-align: left;
            font-weight: 700;
            color: #a5b4fc;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .compare {
            max-width: 1000px;
            margin: 60px auto 0 auto;
            text-align: left;
        }

        .compare h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #f8fafc;
        }

        .compare p {
            color: #94a3b8;
            margin: 5px 0 20px 0;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            gap: 12px 16px;
            align-items: center;
        }

        .compare-grid .col-label,
        .compare-grid .row-label {
            font-weight: 700;
            color: #a5b4fc;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .compare-grid .row-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: center;
        }

        .compare-grid img {
            width: 100%;
            display: block;
            border-radius: 6px;
        }
    </style>
    <script>
        var params1 = [];
        params1["images"] = ["data/sub1_t1_raw.nii.gz"];

        var params2 = [];
        params2["images"] = ["data/sub1_t1_clean.nii.gz"];
    </script>
</head>

<body>
    <div class="header">
        <a href="index.html" class="back-btn">← Back to Overview</a>
        <h1>Structural Preprocessing</h1>
        <p>Comparison of raw vs. preprocessed T1w images</p>
    </div>

    <div class="viewer-label">Top: Unprocessed</div>
    <div class="papaya" data-params="params1"></div>

    <div class="viewer-label">Bottom: Preprocessed</div>
    <div class="papaya" data-params="params2"></div>

    <div class="compare">
        <h2>Comparing Two Brains</h2>
        <p>Sagittal, coronal, and axial slices chosen to show the same part of each brain</p>
        <div class="compare-grid">
            <div></div>
            <div class="col-label">Raw</div>
            <div class="col-label">Preprocessed</div>

            <div class="row-label">Subject 1</div>
            <img src="images/sub1-raw.png" alt="Subject 1 raw T1w: sagittal, coronal, and axial slices">
            <img src="images/sub1-preproc.png" alt="Subject 1 preprocessed T1w: sagittal, coronal, and axial slices">

            <div class="row-label">Subject 2</div>
            <img src="images/sub2-raw.png" alt="Subject 2 raw T1w: sagittal, coronal, and axial slices">
            <img src="images/sub2-preproc.png" alt="Subject 2 preprocessed T1w: sagittal, coronal, and axial slices">
        </div>
    </div>
</body>

</html>
